[package]
name = "keylay"
version = "0.1.0"
description = "Menu bar / tray app that shows the active layer, battery levels and a keymap cheat sheet for QMK and ZMK keyboards"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
bluest = "0.6.9"
futures-lite = "2.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tokio = { version = "1.54.1", features = ["time", "macros", "sync"] }
# native-tls: the OS TLS stack (Security.framework / SChannel), no C build for Windows
ureq = { version = "3.5.1", default-features = false, features = ["native-tls", "gzip"] }
uuid = "1.29.2"

# The menu bar title in a monospaced font (same versions as tray-icon uses)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAttributedString", "NSButton", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSDictionary", "NSString"] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2.6.7"

[target.'cfg(windows)'.dependencies]
# The pure Rust Windows backend, so no C toolchain is needed for hidapi itself
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

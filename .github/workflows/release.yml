name: Release

# Builds a signed and notarized macOS disk image (and the Windows installer) for a version
# tag, and puts them in a draft GitHub release to look over and publish by hand.
#
# Security:
# - Runs only for a version tag pushed to this repository, never for pull requests, so
#   forks never reach the signing secrets.
# - The signing job runs in the "release" environment: its secrets are only readable there,
#   and the environment can require an approval before the job starts.
# - The certificate goes into a temporary keychain with a random password, and the keychain
#   and the API key file are deleted when the job ends, whatever happened.
# - Actions are pinned to commit SHAs, and the release build uses no cache, so nothing
#   from an earlier run or a moved tag ends up in the signed app.
#
# Secrets of the "release" environment (docs/guide.md, "Releases"):
#   APPLE_CERTIFICATE           Developer ID Application certificate and key, .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_API_KEY               App Store Connect API key (.p8 file contents)
#   APPLE_API_KEY_ID            its key ID
#   APPLE_API_ISSUER            its issuer ID

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Search the new keychain first, then the existing ones (one path per word)
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build (signed)
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          codesign --verify --strict --deep src-tauri/target/universal-apple-darwin/release/bundle/macos/KeyLay.app
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$APPLE_API_KEY" > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          rm -f "$key"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "KeyLay $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"

  windows:
    # No secrets: the installer is not signed
    runs-on: windows-latest
    needs: macos
    permissions:
      contents: write # add the installer to the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - run: npm ci

      - name: Build
        run: npx tauri build --bundles nsis

      - name: Add to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe --clobber

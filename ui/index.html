<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeyLay</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="topbar" data-tauri-drag-region>
        <div class="switcher-wrap">
          <button id="switcher" class="switcher" aria-haspopup="listbox" aria-expanded="false">
            <span id="switcher-dot" class="dot"></span>
            <span id="switcher-name" class="switcher-name">-</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5" /><path d="m7 9 5-5 5 5" /></svg>
          </button>
          <div id="menu" class="menu" role="listbox" hidden></div>
        </div>
        <div class="spacer" data-tauri-drag-region></div>
        <span id="link" class="link"></span>
        <button id="pin" class="icon-button" title="Keep open (stays on top while you type)" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5" /><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" /></svg>
        </button>
        <button id="close" class="icon-button" title="Close (Esc)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </header>

      <section class="hero">
        <div class="layer-row">
          <span id="layer-bar" class="layer-bar"></span>
          <div class="layer-text">
            <div id="layer-name" class="layer-name">-</div>
            <div id="layer-detail" class="detail"></div>
          </div>
          <div id="batteries" class="batteries"></div>
        </div>
        <div id="chips" class="chips" role="group" aria-label="Layers"></div>
      </section>

      <div id="preview" class="preview-bar" hidden>
        <span id="preview-text"></span>
        <button id="preview-end" class="link-button">Follow the keyboard</button>
      </div>

      <main id="sheet" class="sheet"></main>

      <footer class="footer">
        <span id="source-icon" class="source-icon"></span>
        <span id="checked" class="checked"></span>
        <div class="toggle" role="group" aria-label="Cheat sheet">
          <button data-mode="current">Current</button>
          <button data-mode="all">All</button>
        </div>
        <button id="reload" class="icon-button small" title="Check for a newer keymap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg>
        </button>
        <button id="config" class="icon-button small" title="Settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9" /><path d="M14 17H5" /><circle cx="17" cy="17" r="3" /><circle cx="7" cy="7" r="3" /></svg>
        </button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
